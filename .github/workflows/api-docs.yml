name: Generate API Docs

on:
  push:
    branches: [ "main" ]

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        pip install -r itas-backend/requirements.txt
        
    - name: Generate OpenAPI schema
      run: |
        cd itas-backend
        # Note: Requires dummy env vars if Django settings need them to load
        python manage.py spectacular --file schema.yml
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: api-schema
        path: itas-backend/schema.yml
