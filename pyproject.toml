[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.github
  | \.venv
  | venv
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip = ["venv", ".venv", "migrations"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "itas.settings.development"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-v --reuse-db --cov=core --cov-report=term-missing --cov-report=xml --cov-fail-under=70"
